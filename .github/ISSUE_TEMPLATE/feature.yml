name: Feature
description: Implement a user story or observable application behavior.
title: "[Feature] "
body:
  - type: input
    id: stories
    attributes:
      label: User-story IDs
      placeholder: "US 01.02.01"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the user, action, and outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes needed to complete this issue.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and design references
      description: Link related issues, wiki diagrams, and shared interfaces.
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Describe relevant automated tests or manual checks.
